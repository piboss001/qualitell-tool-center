<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>详情页长图拼接器 · Qualitell</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">QUALITELL <span>TOOL CENTER</span></a><nav><a class="active" href="/stitch">长图拼接</a><a href="/slice">长图切片</a><a href="/">工具中心 ↗</a></nav></header><main class="shell"><section class="intro"><div class="eyebrow">IMAGE WORKFLOW / 01</div><h1>详情页长图拼接器</h1><p>导入多张图片，调整顺序与输出参数，在浏览器本地完成拼接。</p></section><section class="workspace"><aside class="panel"><h2>图片列表 <small id="count">0 张</small></h2><label class="drop" for="files">＋<b>选择图片</b><span>支持 PNG / JPG / WebP</span></label><input id="files" type="file" accept="image/*" multiple hidden><div id="list" class="list"><p class="empty">尚未添加图片</p></div><button id="clear" class="btn secondary">清空列表</button></aside><section class="panel preview"><div class="panel-title"><h2>拼接预览</h2><span id="status">等待导入图片</span></div><div class="canvas-wrap"><div id="preview" class="preview-content"><div class="empty">添加图片后显示预览</div></div></div></section><aside class="panel settings"><h2>导出设置</h2><label>输出宽度（px）<input id="width" type="number" min="100" max="10000" value="750"></label><label>图片间距（px）<input id="gap" type="number" min="0" max="500" value="0"></label><label>背景颜色<input id="bg" type="color" value="#ffffff"></label><label>导出格式<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><label>图片质量 <input id="quality" type="range" min=".5" max="1" step=".05" value=".92"></label><button id="export" class="btn primary" disabled>导出拼接长图</button><p class="hint">图片仅在当前浏览器本地处理，不会上传服务器。</p></aside></section></main><script src="/app.js"></script></body></html>
