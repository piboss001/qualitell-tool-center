<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长图切片工具 · Qualitell</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">QUALITELL <span>TOOL CENTER</span></a><nav><a href="/stitch">长图拼接</a><a class="active" href="/slice">长图切片</a><a href="/">工具中心 ↗</a></nav></header><main class="shell"><section class="intro"><div class="eyebrow">IMAGE WORKFLOW / 02</div><h1>长图切片工具</h1><p>按固定高度或指定份数切分长图，并批量下载切片。</p></section><section class="workspace" style="grid-template-columns:280px minmax(0,1fr)"><aside class="panel"><h2>源图片</h2><label class="drop" for="source">＋<b>选择长图</b><span>PNG / JPG / WebP</span></label><input id="source" type="file" accept="image/*" hidden><div id="meta" class="hint">尚未选择图片</div><h2 style="margin-top:24px">切片设置</h2><label class="settings-label">切片方式<select id="mode"><option value="fixed">固定高度</option><option value="equal">等分数量</option></select></label><label class="settings-label">高度（px） / 份数<input id="amount" type="number" min="1" value="1000"></label><button id="make" class="btn primary" disabled>生成切片</button><button id="download" class="btn secondary" disabled style="margin-top:8px">批量下载 PNG</button></aside><section class="panel"><div class="panel-title"><h2>切片结果</h2><span id="result">等待导入</span></div><div id="pieces" class="canvas-wrap" style="display:block"><p class="empty">选择长图并生成切片</p></div></section></section></main><script src="/slice.js"></script></body></html>
