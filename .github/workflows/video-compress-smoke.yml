name: One-time video compressor smoke test

on:
  push:
    branches: [main]
    paths: [".github/workflows/video-compress-smoke.yml"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser test tools and sample
        shell: bash
        run: |
          set -euo pipefail
          node --check video-compress.js
          command -v ffmpeg
          command -v ffprobe
          command -v google-chrome
          mkdir -p /tmp/video-smoke
          cd /tmp/video-smoke
          npm init -y >/dev/null
          npm install --silent playwright-core@1.56.1
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=320x180:rate=24:duration=3" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=3" \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -b:v 900k \
            -c:a aac -b:a 96k -shortest /tmp/video-smoke/source.mp4
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/video-http.log 2>&1 &
      - name: Test auto size mode and manual mode in Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          node <<'JS'
          const fs=require("fs");
          const cp=require("child_process");
          const {chromium}=require("/tmp/video-smoke/node_modules/playwright-core");
          const source=fs.readFileSync("/tmp/video-smoke/source.mp4");
          const ffprobe=path=>JSON.parse(cp.execFileSync("ffprobe",["-v","error","-show_streams","-of","json",path]).toString()).streams;
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:["--no-sandbox","--disable-dev-shm-usage","--autoplay-policy=no-user-gesture-required"]});
            const page=await browser.newPage({acceptDownloads:true});
            const errors=[];
            page.on("pageerror",err=>errors.push(err.message));
            page.on("console",msg=>{if(msg.type()==="error")console.log("BROWSER:",msg.text());});
            page.on("dialog",async dialog=>{console.log("ALERT",dialog.message());await dialog.dismiss();throw Error("Unexpected dialog");});
            await page.goto("http://127.0.0.1:8765/video-compress.html",{waitUntil:"networkidle"});
            await page.setInputFiles("#video-file",{name:"sample.mp4",mimeType:"video/mp4",buffer:source});
            await page.locator("#source-card:visible").waitFor({timeout:15000});
            console.log("Source",await page.locator("#source-res").textContent(),await page.locator("#source-duration").textContent());
            // Intelligent target mode must preserve source dimensions.
            await page.locator("#target-size").fill("1");
            await page.locator("#start").click();
            await page.locator("#results:visible").waitFor({timeout:60000});
            let downloadPromise=page.waitForEvent("download");
            await page.locator("#download").click();
            let download=await downloadPromise;
            let path=await download.path();
            const autoStreams=ffprobe(path);
            const autoVideo=autoStreams.find(s=>s.codec_type==="video");
            const autoAudio=autoStreams.find(s=>s.codec_type==="audio");
            console.log("AUTO FILE",download.suggestedFilename(),fs.statSync(path).size,autoVideo?.width,autoVideo?.height,"audio",autoAudio?.codec_name);
            if(autoVideo?.width!==320||autoVideo?.height!==180) throw Error("Auto mode changed resolution");
            if(!autoAudio)throw Error("Auto mode omitted audio");
            if(fs.statSync(path).size>1000000)throw Error("Auto mode exceeded selected target");
            // Manual mode must respect custom dimensions and bitrate.
            await page.locator("#mode-custom").click();
            await page.locator("#resolution").selectOption("custom");
            await page.locator("#lock-ratio").uncheck();
            await page.locator("#custom-width").fill("160");
            await page.locator("#custom-height").fill("90");
            await page.locator("#manual-bitrate").fill("0.4");
            await page.locator("#fps").selectOption("15");
            await page.locator("#start").click();
            await page.locator("#results:visible").waitFor({timeout:60000});
            downloadPromise=page.waitForEvent("download");
            await page.locator("#download").click();
            download=await downloadPromise;
            path=await download.path();
            const manualStreams=ffprobe(path),manualVideo=manualStreams.find(s=>s.codec_type==="video");
            console.log("MANUAL FILE",download.suggestedFilename(),fs.statSync(path).size,manualVideo?.width,manualVideo?.height);
            if(manualVideo?.width!==160||manualVideo?.height!==90)throw Error("Manual mode dimensions mismatch");
            if(errors.length)throw Error("Browser script errors: "+errors.join("; "));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
