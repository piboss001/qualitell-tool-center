name: Vendor PDF libraries for Qualitell PDF tool

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-pdf-libraries.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned open source browser libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pdfjs
          mkdir -p /tmp/pkg-pdfjs /tmp/pkg-pdflib
          cd /tmp/pkg-pdfjs
          npm pack --silent pdfjs-dist@6.5.438 > /tmp/pdfjs-tarball-name.txt
          tar -xzf "$(tail -n 1 /tmp/pdfjs-tarball-name.txt)"
          test -s package/build/pdf.mjs
          test -s package/build/pdf.worker.mjs
          cp package/build/pdf.mjs "$GITHUB_WORKSPACE/vendor/pdfjs/pdf.mjs"
          cp package/build/pdf.worker.mjs "$GITHUB_WORKSPACE/vendor/pdfjs/pdf.worker.mjs"
          cp package/LICENSE "$GITHUB_WORKSPACE/vendor/pdfjs/LICENSE"
          cd /tmp/pkg-pdflib
          npm pack --silent pdf-lib@1.17.1 > /tmp/pdflib-tarball-name.txt
          tar -xzf "$(tail -n 1 /tmp/pdflib-tarball-name.txt)"
          test -s package/dist/pdf-lib.min.js
          cp package/dist/pdf-lib.min.js "$GITHUB_WORKSPACE/vendor/pdf-lib.min.js"
          cp package/LICENSE.md "$GITHUB_WORKSPACE/vendor/pdf-lib-LICENSE.md"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned PDF.js and pdf-lib browser bundles"
            git push
          fi
