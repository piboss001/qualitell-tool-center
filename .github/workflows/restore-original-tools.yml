name: Restore original tools and add tool center homepage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-original-tools.yml"

permissions:
  contents: write

jobs:
  restore-original-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify original source availability
        id: verify
        shell: bash
        run: |
          set +e
          BASE="https://tool.qualitell.com"
          mkdir -p /tmp/original
          files=(app.js styles.css slice.css slice.html slice.js favicon.svg _headers index.html)
          declare -A expected=(
            [app.js]="7d63bf2af41db459a0fc2c92f45a82470491ec64db80e36353c09013fab1ef8b"
            [styles.css]="7fd66fd8bb1534d94052a264cc3372a40155431d7f3f1980dc374446ec06706d"
            [slice.css]="99b7a994d96ec0ae32bed5b993baae5fa069907cfa27e1dd2bf641dabfb3fe13"
            [slice.html]="31ed239ed351425f7053f1a1b2e85b43d5c3ccc665ed860cdd7086ae349a2b27"
            [slice.js]="278726014d4bf246d4c66e1664f391741eade8ca896c5dfd1e036cf9f53d04bc"
            [favicon.svg]="6b83500222a076de19bdcd2a30862aaaf87bcfb6e993fcdd766ce416f9b9298c"
            [_headers]="8607396d10abbb0daa9f1fefe163298151d4b1b8fd21896e94d79c97d6013a8d"
            [index.html]="ac90cdd1552fdf39246bb8bd753dc1bd0f9b5afd4df8365c424f865d59982733"
          )
          report="| File | HTTP | Download | SHA-256 check |\n|---|---:|---|---|\n"
          failed=0
          for file in "${files[@]}"; do
            curl --location --silent --show-error --retry 2 --output "/tmp/original/$file" --write-out "%{http_code}" "$BASE/$file" > "/tmp/original/$file.http" 2> "/tmp/original/$file.err"
            rc=$?
            http="$(cat "/tmp/original/$file.http" 2>/dev/null)"
            if [ "$rc" -ne 0 ] || [ "$http" != "200" ]; then
              err="$(cat "/tmp/original/$file.err" 2>/dev/null | tr '\n' ' ')"
              report+="| $file | $http | failed (curl=$rc) | $err |\n"
              failed=1
              continue
            fi
            actual="$(sha256sum "/tmp/original/$file" | awk '{print $1}')"
            if [ "$actual" = "${expected[$file]}" ]; then
              report+="| $file | $http | downloaded | match |\n"
            else
              report+="| $file | $http | downloaded | mismatch: $actual |\n"
              failed=1
            fi
          done
          echo "$report" > RESTORE-REPORT.md
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "Original files could not be verified from the live site; no project files were changed."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RESTORE-REPORT.md
            git commit -m "Add report for original source verification"
            git push
            exit 0
          fi

          # All downloaded source files match the uploaded ZIP exactly.
          cp /tmp/original/app.js app.js
          cp /tmp/original/styles.css styles.css
          cp /tmp/original/slice.css slice.css
          cp /tmp/original/slice.js slice.js
          cp /tmp/original/slice.html slice.html
          cp /tmp/original/favicon.svg favicon.svg
          cp /tmp/original/_headers _headers
          cp /tmp/original/index.html stitcher.html

          python3 - <<'PY'
          from pathlib import Path
          for filename in ("stitcher.html", "slice.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace('href="index.html"', 'href="/stitcher"')
              text = text.replace('href="slice.html"', 'href="/slice"')
              path.write_text(text, encoding="utf-8")
          PY

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#f6f8f5">
            <title>Qualitell Tool Center · 在线工具中心</title>
            <meta name="description" content="Qualitell 在线工具中心，集中使用图片拼接、长图切片和更多设计效率工具。">
            <link rel="icon" href="/favicon.svg" type="image/svg+xml">
            <style>
              :root{--ink:#202820;--muted:#748078;--line:#e5eae5;--green:#3f7652;--green-soft:#edf4ee;--paper:#f6f8f5;--white:#fff}
              *{box-sizing:border-box}
              body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
              a{color:inherit;text-decoration:none}
              .wrap{width:min(1120px,calc(100% - 48px));margin:0 auto}
              header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
              .brand{font-size:20px;font-weight:800;letter-spacing:.06em}.brand span{color:var(--green)}
              .top-label{font-size:11px;letter-spacing:.16em;color:#879188}
              .hero{padding:78px 0 54px}
              .eyebrow{font-size:11px;font-weight:750;letter-spacing:.2em;color:var(--green)}
              h1{font-size:clamp(36px,5.5vw,56px);line-height:1.12;letter-spacing:-.045em;margin:17px 0 16px}
              .intro{max-width:650px;color:var(--muted);font-size:15px;line-height:1.9;margin:0}
              .section-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 20px}
              .section-head h2{font-size:18px;margin:0}.section-head span{font-size:11px;color:#8b958d;letter-spacing:.1em}
              .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:82px}
              .card{min-height:236px;padding:25px;background:var(--white);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s}
              a.card:hover{transform:translateY(-4px);border-color:#aac5b0;box-shadow:0 14px 34px rgba(27,56,34,.07)}
              .icon{width:48px;height:48px;display:grid;place-items:center;background:var(--green-soft);border-radius:12px;color:var(--green);font-size:23px;margin-bottom:24px}
              .card h3{font-size:17px;margin:0 0 9px}.card p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}
              .card-foot{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--green);font-weight:650}
              .status{font-size:10px;color:#4d7d5a;background:#edf5ee;border-radius:30px;padding:4px 9px;font-weight:600}
              .planned{background:#fafbfa;border-style:dashed}.planned .icon{background:#f0f2ef;color:#879188}.planned .card-foot{color:#929b94}.planned .status{background:#f0f2f0;color:#858e87}
              footer{border-top:1px solid var(--line);padding:23px 0;color:#929b94;font-size:11px}
              @media(max-width:760px){.wrap{width:calc(100% - 36px)}.hero{padding:56px 0 40px}.grid{grid-template-columns:1fr;gap:12px;padding-bottom:56px}.card{min-height:205px;padding:22px}.top-label{font-size:9px}}
            </style>
          </head>
          <body>
            <div class="wrap">
              <header><a class="brand" href="/">QUALITELL<span>.</span></a><div class="top-label">PRODUCTIVITY TOOL CENTER</div></header>
              <main>
                <section class="hero"><div class="eyebrow">QUALITELL · WORKSPACE</div><h1>在线工具中心</h1><p class="intro">集中管理产品图片处理、详情页制作与日常设计辅助工具。选择需要的工具即可开始使用，更多功能将持续更新。</p></section>
                <section aria-labelledby="tools-title">
                  <div class="section-head"><h2 id="tools-title">全部工具</h2><span>ALL TOOLS</span></div>
                  <div class="grid">
                    <a class="card" href="/stitcher"><div class="icon" aria-hidden="true">▤</div><h3>详情页长图拼接器</h3><p>导入详情页切图，调整顺序、输出宽度与间距，预览并导出完整长图。</p><div class="card-foot"><span>打开工具</span><span class="status">已上线　↗</span></div></a>
                    <a class="card" href="/slice"><div class="icon" aria-hidden="true">▥</div><h3>长图切片工具</h3><p>将长图按指定高度或等分数量切片，预览结果并批量导出。</p><div class="card-foot"><span>打开工具</span><span class="status">已上线　↗</span></div></a>
                    <div class="card planned"><div class="icon" aria-hidden="true">▧</div><h3>图片批量处理</h3><p>规划支持批量调整尺寸、格式转换、图片压缩与统一命名。</p><div class="card-foot"><span>功能开发中</span><span class="status">规划中</span></div></div>
                    <div class="card planned"><div class="icon" aria-hidden="true">✦</div><h3>更多设计工具</h3><p>根据团队日常工作需求，逐步扩展更多实用工具。</p><div class="card-foot"><span>持续更新</span><span class="status">规划中</span></div></div>
                  </div>
                </section>
              </main>
              <footer>© 2026 QUALITELL. All rights reserved.</footer>
            </div>
          </body>
          </html>
          HTML

          printf '%s\n' '/stitch /stitcher 301' > _redirects
          rm -f RESTORE-REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html stitcher.html app.js styles.css slice.html slice.css slice.js favicon.svg _headers _redirects
          git commit -m "Restore original DeepSeek tools and add tool center homepage"
          git push
