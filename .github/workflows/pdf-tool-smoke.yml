name: One-time PDF tool browser smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pdf-tool-smoke.yml"
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation library
        run: |
          mkdir -p /tmp/pdf-smoke
          cd /tmp/pdf-smoke
          npm init -y >/dev/null
          npm install --silent playwright-core@1.56.1
      - name: Check JavaScript syntax
        run: node --check pdf-tool.js
      - name: Exercise image conversion and PDF compression in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chromium executable not found"
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          export CHROME_BIN
          node <<'JS'
          const fs=require("fs");
          const {chromium}=require("/tmp/pdf-smoke/node_modules/playwright-core");
          const zlib=require("zlib");
          const crcTable=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;});
          const crc32=bytes=>{let c=0xFFFFFFFF;for(const b of bytes)c=(c>>>8)^crcTable[(c^b)&255];return(c^0xFFFFFFFF)>>>0;};
          function chunk(type,data){const t=Buffer.from(type);const len=Buffer.alloc(4);len.writeUInt32BE(data.length);const crc=Buffer.alloc(4);crc.writeUInt32BE(crc32(Buffer.concat([t,data])));return Buffer.concat([len,t,data,crc]);}
          function png(w,h){const header=Buffer.alloc(13);header.writeUInt32BE(w,0);header.writeUInt32BE(h,4);header[8]=8;header[9]=2;const pixels=Buffer.alloc(h*(w*3+1));for(let y=0;y<h;y++){for(let x=0;x<w;x++){const at=y*(w*3+1)+1+x*3;pixels[at]=x%255;pixels[at+1]=y%255;pixels[at+2]=110;}}return Buffer.concat([Buffer.from("89504e470d0a1a0a","hex"),chunk("IHDR",header),chunk("IDAT",zlib.deflateSync(pixels)),chunk("IEND",Buffer.alloc(0))]);}
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:["--no-sandbox","--disable-dev-shm-usage"]});
            const page=await browser.newPage({acceptDownloads:true});
            const errors=[];page.on("pageerror",e=>errors.push(e.message));
            page.on("console",m=>{if(m.type()==="error")console.log("BROWSER:",m.text());});
            await page.goto("http://127.0.0.1:8765/pdf-tool.html",{waitUntil:"networkidle",timeout:30000});
            await page.setInputFiles("#image-input",[{name:"one.png",mimeType:"image/png",buffer:png(320,650)},{name:"two.png",mimeType:"image/png",buffer:png(400,900)}]);
            await page.waitForFunction(()=>document.querySelectorAll(".item").length===2);
            await page.selectOption("#image-mode","long");
            await page.click("#make-pdf");
            await page.locator("#result-card:not([hidden])").waitFor({timeout:60000});
            let d=page.waitForEvent("download");
            await page.click("#download-result");
            let file=await (await d).path();
            const pdf=fs.readFileSync(file);
            if(pdf.subarray(0,5).toString()!=="%PDF-")throw Error("Images output is not a PDF");
            console.log("Image PDF bytes:",pdf.length);
            await page.click("#tab-pdf");
            await page.setInputFiles("#pdf-input",{name:"test.pdf",mimeType:"application/pdf",buffer:pdf});
            await page.waitForFunction(()=>document.querySelector("#pdf-page-count").textContent.includes("1 页"),{timeout:30000});
            await page.click("#compress-pdf");
            await page.locator("#result-card:not([hidden])").waitFor({timeout:60000});
            d=page.waitForEvent("download");
            await page.click("#download-result");
            file=await (await d).path();
            const compressed=fs.readFileSync(file);
            if(compressed.subarray(0,5).toString()!=="%PDF-")throw Error("Compressed output is not a PDF");
            console.log("PDF compression output bytes:",compressed.length);
            if(errors.length)throw Error("Browser page errors: "+errors.join("; "));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS